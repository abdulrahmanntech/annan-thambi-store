<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annan Thambi Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 "Segoe UI",Arial,sans-serif;background:#f4f5f7;color:#222}
nav{position:fixed;top:0;left:0;bottom:0;width:210px;background:#fff;border-right:1px solid #e3e5e8;padding:14px 10px;overflow:auto}
nav h2{font-size:17px;margin:4px 8px 14px;color:#1b7f3b}nav a{display:block;padding:9px 12px;border-radius:8px;color:#333;text-decoration:none;margin-bottom:2px;cursor:pointer}
nav a:hover{background:#f0f2f4}nav a.on{background:#e6f4ea;color:#1b7f3b;font-weight:600}
main{margin-left:210px;padding:22px}h1{font-size:22px;margin:0 0 14px}h3{margin:18px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card,.box{background:#fff;border:1px solid #e3e5e8;border-radius:10px;padding:14px}.card small{color:#777}.card b{display:block;font-size:22px;margin-top:4px}
.red{color:#c62828}.green{color:#1b7f3b}.right{text-align:right}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e5e8}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #eef0f2}th{background:#fafbfc;font-size:13px;color:#555}
input,select,button{font:inherit;padding:8px 10px;border:1px solid #ccd0d5;border-radius:8px;background:#fff}button{cursor:pointer}
.pri{background:#1b7f3b;border-color:#1b7f3b;color:#fff}.dng{color:#c62828;border-color:#e6b0b0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tag{padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600}.t0{background:#e6f4ea;color:#1b7f3b}.t1{background:#fdecea;color:#c62828}.t2{background:#c62828;color:#fff}
.chart{display:flex;align-items:flex-end;gap:12px;height:190px}.chart div{flex:1;text-align:center;font-size:12px}.chart i{display:block;background:#1b7f3b;border-radius:5px 5px 0 0;min-height:2px}
dialog{border:1px solid #ccd0d5;border-radius:12px;padding:18px;width:min(460px,92vw)}dialog label{display:block;margin:8px 0 2px;font-size:13px;color:#555}dialog input,dialog select{width:100%}
.list{max-height:420px;overflow:auto;border:1px solid #e3e5e8;border-radius:8px;background:#fff}.list div{padding:8px 10px;border-bottom:1px solid #eef0f2;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.list div:hover{background:#f0f8f2}
#rcw{display:none;position:fixed;inset:0;background:#0006;overflow:auto;padding:20px}#rcw.open{display:block}.rc{max-width:420px;margin:auto;background:#fff;padding:14px;border-radius:8px}.rcb{display:grid;grid-template-columns:24px 1fr 24px;border-left:2px solid #000;border-right:2px solid #000;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rmid{padding:0 6px;min-width:0}.rest{text-align:center;font-weight:700;letter-spacing:4px;font-size:15px;margin-bottom:2px}.rln{text-align:center;margin:2px 0}.rside{position:relative;overflow:hidden;background:#f2f2f2}.rside:first-child{border-right:1px solid #000}.rside:last-child{border-left:1px solid #000}.rside span{position:absolute;inset:0;writing-mode:vertical-rl;text-orientation:upright;font-size:10px;font-weight:700;letter-spacing:1px;line-height:24px;text-align:center;white-space:nowrap;overflow:hidden}
@media(max-width:800px){nav{position:static;width:auto;display:flex;flex-wrap:wrap}main{margin:0}.g2{grid-template-columns:1fr}}
.rl{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.rg{display:grid;grid-template-columns:28px 1fr 54px 58px 68px;gap:4px;font-size:13px;padding:3px 0}.rh{border-bottom:1px solid #999}.right{text-align:right}
@media print{nav,.np{display:none!important}main{margin:0}body.ro main{display:none}#rcw{position:static;background:#fff;padding:0}#rcw:not(.open){display:none}.rc{max-width:none}}
</style></head><body><nav id="nav"></nav><main id="main"></main><dialog id="dlg"></dialog><div id="rcw"></div>
<script>
if(window.atsFile){const _a=window.alert,_c=window.confirm;window.alert=m=>{_a(m);atsFile.refocus()};window.confirm=m=>{const r=_c(m);atsFile.refocus();return r}}
const K='ats_v1',U=['kg','gram','litre','ml','packet','piece','box'];
const seed=[["Rice (Ponni)","1001","Grains",48,56,50,"kg",10],["Sugar","1002","Grains",40,46,30,"kg",8],["Wheat Flour","1003","Grains",34,40,25,"kg",8],["Toor Dal","1004","Pulses",110,125,20,"kg",5],["Cooking Oil","1005","Oils",120,135,15,"litre",5],["Salt","1006","Spices",16,20,20,"packet",5],["Milk","1007","Dairy",23,27,30,"packet",10],["Tea Powder","1008","Beverages",85,98,12,"packet",4],["Biscuits","1009","Snacks",8,10,60,"packet",15],["Soap","1010","Personal Care",28,35,40,"piece",10],["Shampoo Sachet","1011","Personal Care",1.5,2,100,"piece",30],["Chilli Powder","1012","Spices",90,110,10,"packet",3],["Turmeric Powder","1013","Spices",45,55,12,"packet",3]];
const $=s=>document.querySelector(s),m=v=>'₹'+(+v||0).toFixed(2),n=v=>+(+v||0).toFixed(3),td=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D,SRV=false,REV=0;
try{const x=new XMLHttpRequest();x.open('GET','/api/data',false);x.send();if(x.status===200){const r=JSON.parse(x.responseText);SRV=true;REV=r.rev;D=r.data}}catch(e){}
if(!D&&window.atsFile){try{D=JSON.parse(atsFile.read()||'null')}catch(e){}}
if(!D&&!SRV){try{D=JSON.parse(localStorage.getItem(K))}catch(e){}}
D=D||{p:seed.map(r=>({id:uid(),name:r[0],code:r[1],cat:r[2],buy:r[3],sell:r[4],stock:r[5],unit:r[6],min:r[7]})),b:[],pu:[],ex:[],log:[],customers:[],payments:[],s:{name:'Annan Thambi Store',addr:'',ph:''}};
D.customers=D.customers||[];D.payments=D.payments||[];
D.b.forEach(b=>{if(b.paid==null)b.paid=b.total||0;if(b.due==null)b.due=0;if(b.prev==null)b.prev=0;});
const customerByName=name=>D.customers.find(c=>c.name.toLowerCase()===String(name||'').trim().toLowerCase());
const balanceOf=name=>{const c=customerByName(name);return c?Math.max(0,+c.balance||0):0;};
const ensureCustomer=(name,phone='')=>{name=String(name||'').trim();if(!name)return null;let c=customerByName(name);if(!c){c={id:uid(),name,phone,balance:0};D.customers.push(c)}else if(phone)c.phone=phone;return c;};
let _sq=Promise.resolve();
const srvSave=j=>{_sq=_sq.then(()=>fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:'{"rev":'+REV+',"data":'+j+'}'}).then(async r=>{if(r.status===409){alert('Data was changed on another device. The page will reload with the latest data.');location.reload()}else if(r.ok){REV=(await r.json()).rev}else alert('Could not save to the server!')}).catch(()=>alert('Server not reachable! Changes are NOT saved.')))};
const save=()=>{const j=JSON.stringify(D);if(SRV){srvSave(j);return}try{localStorage.setItem(K,j)}catch(e){if(!window.atsFile)alert('Could not save data! Storage full or blocked.')}if(window.atsFile)atsFile.write(j)};
const st=p=>p.stock<=0?'Out of stock':p.stock<=p.min?'Low stock':'In stock',tg=p=>`<span class="tag t${['In stock','Low stock','Out of stock'].indexOf(st(p))}">${st(p)}</span>`;
const log=(p,c,r)=>D.log.unshift({at:td()+' '+new Date().toTimeString().slice(0,5),name:p.name,c,r});
const P=id=>D.p.find(x=>x.id==id),cats=()=>[...new Set(D.p.map(p=>p.cat))].sort();
const NAV=[['dash','Dashboard','📊'],['bill','New Bill','🧾'],['prod','Products','📦'],['sales','Sales History','📜'],['stock','Stock Management','🏬'],['purch','Purchases','🚚'],['exp','Expenses','💸'],['rep','Reports','📈'],['cust','Customer Ledger','👥'],['set','Settings','⚙️']];
let cart=[],F={};
function csv(name,rows){const t=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name+'.csv';a.click()}
const sel=(k,v)=>F[k]==v?'selected':'';
const clearF=(...k)=>{k.forEach(x=>delete F[x]);render()};
const clearDlg=()=>{document.querySelectorAll('#dlg input:not([type=checkbox]):not([type=file])').forEach(i=>i.value='');const f=document.querySelector('#dlg input');if(f)f.focus()};
const clearIds=(ids,focus)=>{ids.forEach(i=>{const e=$('#'+i);if(e)e.value=''});if(focus&&$('#'+focus))$('#'+focus).focus()};
function clearBill(){if(cart.length&&!confirm('Clear this whole bill?'))return;cart=[];render()}
function clearPur(){clearIds(['ps','pp','pq','pr'],'ps');$('#pd').value=td()}
function clearExp(){clearIds(['et','ea'],'et');$('#ed').value=td()}
function dlgShow(h){$('#dlg').innerHTML=h;$('#dlg').showModal()}
const pages={
dash(){const t=td(),tb=D.b.filter(b=>b.at.slice(0,10)==t),tot=tb.reduce((a,b)=>a+b.total,0),pr=tb.reduce((a,b)=>a+b.items.reduce((x,i)=>x+(i.price-i.cost)*i.qty,0)-b.disc,0);
let ch='',mx=1,days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toLocaleDateString('en-CA');const v=D.b.filter(b=>b.at.slice(0,10)==k).reduce((a,b)=>a+b.total,0);days.push([k.slice(5),v]);mx=Math.max(mx,v)}
ch=days.map(([k,v])=>`<div><small>${m(v)}</small><i style="height:${v/mx*110}px"></i>${k}</div>`).join('');
return `<h1>Dashboard</h1><div class="cards"><div class="card"><small>Total products</small><b>${D.p.length}</b></div><div class="card"><small>Total stock quantity</small><b>${n(D.p.reduce((a,p)=>a+p.stock,0))}</b></div><div class="card"><small>Today's sales</small><b class="green">${m(tot)}</b></div><div class="card"><small>Bills today</small><b>${tb.length}</b></div><div class="card"><small>Today's profit (est.)</small><b class="green">${m(pr)}</b></div><div class="card"><small>Low-stock items</small><b class="red">${D.p.filter(p=>st(p)=='Low stock').length}</b></div><div class="card"><small>Out-of-stock items</small><b class="red">${D.p.filter(p=>st(p)=='Out of stock').length}</b></div></div><div class="box"><b>Sales – last 7 days</b><br><br><div class="chart">${ch}</div></div><p><button class="pri" onclick="go('bill')">+ New Bill</button> <button onclick="go('stock')">View Low Stock</button> <button class="dng" onclick="clearTodaySales()">Clear Today's Sales</button></p>`},
bill(){return `<h1>New Bill</h1><div class="g2"><div><div class="bar" style="margin-bottom:8px"><input id="bs" placeholder="Search name or barcode (Enter adds)" style="flex:1" oninput="bList()" onkeydown="bKey(event)"><button onclick="clearIds(['bs'],'bs');bList()">Clear</button></div><div class="list" id="bl"></div></div><div class="box"><div class="bar"><input id="cu" list="customerNames" placeholder="Customer name (optional)" oninput="updateBalance()" style="flex:1;min-width:170px"><datalist id="customerNames">${D.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><input id="cphone" placeholder="Phone (optional)" style="width:145px"><button onclick="clearIds(['cu','cphone'],'cu');updateBalance()">Clear</button></div><p>Pre Balance available: <b id="prevBal">₹0.00</b></p><label style="display:block;margin:8px 0"><input id="addPrev" type="checkbox" onchange="cDraw()"> Manually add previous balance to this bill</label><div id="cart"></div><div class="bar"><select id="py"><option>Cash</option><option>UPI</option><option>Other</option><option>Partial Payment</option></select><label>Discount ₹ <input id="di" type="number" min="0" step="0.01" value="0" style="width:90px" oninput="cDraw()"></label><button onclick="$('#di').value=0;cDraw()">Clear</button></div><p>Items purchased: <b id="su"></b></p><p>Total: <b id="to"></b></p><label>Amount Paid Now ₹ <input id="paidNow" type="number" min="0" step="0.01" value="0" oninput="cDraw()" style="width:130px"></label> <button onclick="$('#paidNow').value=0;cDraw()">Clear</button><p>Total Due: <b class="red" id="dueNow">₹0.00</b></p><div class="red" id="er"></div><button class="pri" onclick="finish()">Save Bill</button> <button onclick="printCurrent()">Print Bill</button> <button class="dng" onclick="clearBill()">Clear Whole Bill</button></div></div>`},
cust(){const q=(F.cq||'').toLowerCase(),L=D.customers.filter(c=>(!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q))&&(F.onlyDebt!=='1'||c.balance>0));return `<h1>Customer Ledger / Udhaar</h1><div class="cards"><div class="card"><small>Total customers</small><b>${D.customers.length}</b></div><div class="card"><small>Total outstanding debt</small><b class="red">${m(D.customers.reduce((a,c)=>a+(+c.balance||0),0))}</b></div></div><div class="bar"><input placeholder="Search customer or phone" value="${esc(F.cq||'')}" oninput="F.cq=this.value;rrCust()"><label><input type="checkbox" ${F.onlyDebt==='1'?'checked':''} onchange="F.onlyDebt=this.checked?'1':'';render()"> Only customers who owe money</label><button onclick="clearF('cq','onlyDebt')">Clear</button><button class="pri" onclick="recordPayment()">+ Record Payment</button></div><table><tr><th>Customer</th><th>Phone</th><th>Outstanding balance</th><th>Actions</th></tr>${L.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'')}</td><td class="${c.balance>0?'red':'green'}"><b>${m(c.balance)}</b></td><td><button onclick="showCustomer('${c.id}')">History</button> <button onclick="recordPayment('${c.id}')">Record payment</button> <button class="dng" onclick="delCustomer('${c.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="4">No customers found.</td></tr>'}</table>`},
prod(){const q=(F.pq||'').toLowerCase(),c=F.pc||'';const L=D.p.filter(p=>(!q||p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q))&&(!c||p.cat==c)).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name));
return `<h1>Products</h1><div class="bar"><input placeholder="Search name or barcode" value="${esc(F.pq)}" oninput="F.pq=this.value;rr('pt')"><select onchange="F.pc=this.value;render()"><option value="">All categories</option>${cats().map(x=>`<option ${sel('pc',x)}>${esc(x)}</option>`).join('')}</select><button onclick="clearF('pq','pc')">Clear</button><button class="pri" onclick="pForm()">+ Add Product</button><span>Total quantity in shop: <b>${n(D.p.reduce((a,p)=>a+p.stock,0))}</b></span></div><div id="pt">${ptab(L)}</div>`},
sales(){const q=(F.sq||'').toLowerCase(),a=F.sa||'',b=F.sb||'';const L=D.b.filter(x=>(!q||x.no.toLowerCase().includes(q)||x.cust.toLowerCase().includes(q))&&(!a||x.at.slice(0,10)>=a)&&(!b||x.at.slice(0,10)<=b));
return `<h1>Sales History</h1><div class="bar"><input placeholder="Bill no. or customer" value="${esc(F.sq)}" oninput="F.sq=this.value;rr('st')"><input type="date" value="${a}" onchange="F.sa=this.value;rr('st')"><input type="date" value="${b}" onchange="F.sb=this.value;rr('st')"><button onclick="clearF('sq','sa','sb')">Clear</button></div><div id="st">${stab(L)}</div>`},
stock(){return `<h1>Stock Management</h1><p>Total stock value (at purchase price): <b>${m(D.p.reduce((a,p)=>a+p.stock*p.buy,0))}</b></p><div class="bar"><h3 style="color:#c62828;margin:0;flex:1">⚠ Low Stock (at or below minimum level)</h3><button class="pri" onclick="lowPdf()">📄 Download Low Stock PDF</button></div><div id="lowBox">${lowTab(lowList())}</div><h3>All products</h3><table><tr><th>Product</th><th>Available</th><th>Min level</th><th>Status</th><th>Buy</th><th>Sell</th><th>Stock value</th></tr>${D.p.map(p=>`<tr><td>${esc(p.name)}</td><td>${n(p.stock)} ${p.unit}</td><td>${n(p.min)}</td><td>${tg(p)}</td><td>${m(p.buy)}</td><td>${m(p.sell)}</td><td>${m(p.stock*p.buy)}</td></tr>`).join('')}</table>`},
purch(){return `<h1>Purchases</h1><div class="box bar"><input id="ps" placeholder="Supplier name"><select id="pp"><option value="">Select product</option>${D.p.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.unit})</option>`).join('')}</select><input id="pq" type="number" step="0.001" min="0" placeholder="Quantity"><input id="pr" type="number" step="0.01" min="0" placeholder="Purchase price"><input id="pd" type="date" value="${td()}"><button class="pri" onclick="addPur()">Save Purchase</button><button onclick="clearPur()">Clear Form</button></div><div class="bar"><span style="flex:1">Purchase history (${D.pu.length} records)</span><button class="dng" onclick="clearPurchases()">Clear Purchase History</button></div><p><small>Removing purchase records clears the history only; it does not change current stock quantities.</small></p><table><tr><th>Date</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th>Action</th></tr>${D.pu.map(r=>`<tr><td>${r.date}</td><td>${esc(r.sup)}</td><td>${esc(r.name)}</td><td>${n(r.qty)}</td><td>${m(r.price)}</td><td>${m(r.qty*r.price)}</td><td><button class="dng" onclick="delPur('${r.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="7">No purchase records.</td></tr>'}</table>`},
exp(){return `<h1>Expenses</h1><div class="box bar"><input id="et" placeholder="e.g. Electricity, Rent, Salary"><input id="ea" type="number" step="0.01" min="0" placeholder="Amount"><input id="ed" type="date" value="${td()}"><button class="pri" onclick="addExp()">Add Expense</button><button onclick="clearExp()">Clear Form</button></div><div class="bar"><span style="flex:1">Total: <b>${m(D.ex.reduce((a,e)=>a+e.amt,0))}</b></span><button class="dng" onclick="clearExpenses()">Clear Expense History</button></div><table><tr><th>Date</th><th>Title</th><th>Amount</th><th>Action</th></tr>${D.ex.map(e=>`<tr><td>${e.date}</td><td>${esc(e.t)}</td><td>${m(e.amt)}</td><td><button class="dng" onclick="delExp('${e.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="4">No expenses recorded.</td></tr>'}</table>`},
rep(){const a=F.ra||td().slice(0,8)+'01',b=F.rb||td(),B=D.b.filter(x=>x.at.slice(0,10)>=a&&x.at.slice(0,10)<=b),PU=D.pu.filter(x=>x.date>=a&&x.date<=b),EX=D.ex.filter(x=>x.date>=a&&x.date<=b);
const tot=B.reduce((s,x)=>s+x.total,0),pr=B.reduce((s,x)=>s+x.items.reduce((y,i)=>y+(i.price-i.cost)*i.qty,0)-x.disc,0),ex=EX.reduce((s,x)=>s+x.amt,0);
const wk=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return 'Week of '+x.toLocaleDateString('en-CA')};
const grp=f=>{const o={};B.forEach(x=>{const k=f(x.at.slice(0,10));o[k]=o[k]||[0,0];o[k][0]++;o[k][1]+=x.total});return Object.entries(o).sort().reverse()};
const gt=(t,L)=>`<h3>${t}</h3><table><tr><th>Period</th><th>Bills</th><th>Sales</th></tr>${L.map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}</td><td>${m(v[1])}</td></tr>`).join('')||'<tr><td colspan=3>No data</td></tr>'}</table>`;
const bs={};B.forEach(x=>x.items.forEach(i=>{const k=i.name+'|'+i.unit;bs[k]=bs[k]||[0,0];bs[k][0]+=i.qty;bs[k][1]+=i.amt}));const best=Object.entries(bs).sort((x,y)=>y[1][1]-x[1][1]).slice(0,10);
const py={};B.forEach(x=>{py[x.pay]=py[x.pay]||[0,0];py[x.pay][0]++;py[x.pay][1]+=x.total});
const low=D.p.filter(p=>st(p)!='In stock');
return `<h1>Reports</h1><div class="bar">From <input type="date" value="${a}" onchange="F.ra=this.value;render()"> To <input type="date" value="${b}" onchange="F.rb=this.value;render()"><button onclick="clearF('ra','rb')">Clear dates</button><button onclick="print()">Print</button><button onclick="xs('${a}','${b}')">Export Sales CSV</button><button onclick="xp('${a}','${b}')">Export Purchases CSV</button><button onclick="xk()">Export Stock CSV</button></div>
<div class="cards"><div class="card"><small>Sales</small><b>${m(tot)}</b></div><div class="card"><small>Estimated profit</small><b class="green">${m(pr)}</b></div><div class="card"><small>Expenses</small><b>${m(ex)}</b></div><div class="card"><small>Profit after expenses</small><b>${m(pr-ex)}</b></div></div>
<div class="g2"><div>${gt('Daily sales',grp(d=>d))}</div><div>${gt('Weekly sales',grp(wk))}${gt('Monthly sales',grp(d=>d.slice(0,7)))}</div></div>
<div class="g2"><div><h3>Best-selling products</h3><table><tr><th>Product</th><th>Qty</th><th>Amount</th></tr>${best.map(([k,v])=>`<tr><td>${esc(k.split('|')[0])}</td><td>${n(v[0])} ${k.split('|')[1]}</td><td>${m(v[1])}</td></tr>`).join('')||'<tr><td colspan=3>No data</td></tr>'}</table></div>
<div><h3>Cash vs UPI vs Other</h3><table><tr><th>Method</th><th>Bills</th><th>Amount</th></tr>${Object.entries(py).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}</td><td>${m(v[1])}</td></tr>`).join('')||'<tr><td colspan=3>No data</td></tr>'}</table></div></div>

function finish(){const er=t=>$('#er').textContent=t;if(!cart.length)return er('Add at least one product.');let sub=0;const items=[];

function clearTodaySales(){const today=td(),todayBills=D.b.filter(b=>b.at.slice(0,10)===today);if(!todayBills.length)return alert('There are no sales recorded today.');if(!confirm(`Clear ${todayBills.length} bill(s) from today's sales? This will remove today's bills, restore sold stock, and reverse the customer balance changes from those bills. This cannot be undone unless you have a backup.`))return;const ids=new Set(todayBills.map(b=>b.no));todayBills.forEach(b=>{(b.items||[]).forEach(i=>{const p=P(i.id);if(p){p.stock=Math.round((p.stock+(+i.qty||0))*1000)/1000;log(p,+i.qty||0,'Reversed cleared sale '+b.no)}});if(b.customerId){const c=D.customers.find(x=>x.id===b.customerId);if(c){const delta=Number.isFinite(+b.balanceDelta)?+b.balanceDelta:((+b.sub||0)-(+b.disc||0)-(+b.paid||0));c.balance=Math.max(0,Math.round((c.balance-delta)*100)/100)}}});D.b=D.b.filter(b=>b.at.slice(0,10)!==today);D.payments=D.payments.filter(p=>!(p.note||'').startsWith('Payment on bill ')||!todayBills.some(b=>(p.note||'')==='Payment on bill '+b.no));save();cart=[];render();alert("Today's sales have been cleared.")}

// purchases, expenses
function addPur(){const p=P($('#pp').value),sup=$('#ps').value.trim(),q=parseFloat($('#pq').value),pr=parseFloat($('#pr').value);if(!p||!sup||!(q>0)||!(pr>=0))return alert('Enter supplier, product, quantity (above 0) and price.');
D.pu.unshift({id:uid(),sup,pid:p.id,name:p.name,qty:q,price:pr,date:$('#pd').value||td()});p.stock=Math.round((p.stock+q)*1000)/1000;p.buy=pr;log(p,q,'Purchase from '+sup);save();render()}
function addExp(){const t=$('#et').value.trim(),a=parseFloat($('#ea').value);if(!t||!(a>0))return alert('Enter a title and an amount above 0.');D.ex.unshift({id:uid(),t,amt:a,date:$('#ed').value||td()});save();render()}
function delExp(id){if(confirm('Delete this expense?')){D.ex=D.ex.filter(e=>e.id!=id);save();render()}}
function clearExpenses(){if(!D.ex.length)return alert('No expense records to clear.');if(confirm('Clear ALL expense records? This does not affect sales, purchases, or stock.')){D.ex=[];save();render();alert('Expense history cleared.')}}
function clearPurchases(){if(!D.pu.length)return alert('No purchase records to clear.');if(confirm('Clear ALL purchase history records? Current stock quantities will NOT change.')){D.pu=[];save();render();alert('Purchase history cleared.')}}
function delPur(id){if(confirm('Remove this purchase history record? Current stock quantities will NOT change.')){D.pu=D.pu.filter(r=>r.id!==id);save();render()}}
function clearStockLog(){if(!D.log.length)return alert('No stock history to clear.');if(confirm('Clear ALL stock change history? Current stock quantities will NOT change.')){D.log=[];save();render();alert('Stock change history cleared.')}}
function delStockLog(index){if(!Number.isInteger(index)||index<0||index>=D.log.length)return;if(confirm('Remove this stock history entry? Current stock quantities will NOT change.')){D.log.splice(index,1);save();render()}}
// exports, settings
const xs=(a,b)=>csv('sales_'+a+'_'+b,[['Bill','Date','Customer','Subtotal','Discount','Total','Payment'],...D.b.filter(x=>x.at.slice(0,10)>=a&&x.at.slice(0,10)<=b).map(x=>[x.no,x.at,x.cust,x.sub,x.disc,x.total,x.pay])]);
const xp=(a,b)=>csv('purchases_'+a+'_'+b,[['Date','Supplier','Product','Qty','Price'],...D.pu.filter(x=>x.date>=a&&x.date<=b).map(x=>[x.date,x.sup,x.name,x.qty,x.price])]);
const xk=()=>csv('stock_'+td(),[['Product','Category','Stock','Unit','Min','Buy','Sell','Status'],...D.p.map(p=>[p.name,p.cat,p.stock,p.unit,p.min,p.buy,p.sell,st(p)])]);
function saveSet(){D.s={name:$('#sn').value.trim()||'Annan Thambi Store',addr:$('#sa').value.trim(),ph:$('#sp').value.trim()};save();render();alert('Saved.')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='annan_thambi_backup_'+td()+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.p||!x.b)throw 0;if(confirm('Replace ALL current data with this backup?')){D=x;save();render()}}catch(e){alert('Not a valid backup file.')}};r.readAsText(f)}
addEventListener('beforeprint',()=>document.body.classList.toggle('ro',$('#rcw').classList.contains('open')));
render();
</script></body></html>
